name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
      - name: Set up Node.js
        uses: actions/setup-node@7f84f1d52d0c56afb45c62fee31a93b843cea4d6 # main
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # main
      - name: Upload site
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # main
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@5e98f10ce206463e411e82ac66ef0f2df79c5499 # main

