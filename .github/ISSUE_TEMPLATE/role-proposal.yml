name: Role proposal
description: Propose a portable role for the community catalog.
title: 'role: '
labels:
  - role-proposal
body:
  - type: input
    id: name
    attributes:
      label: Role name
      placeholder: io.github.publisher/role-name
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: Job and non-goals
      description: What should this role do, and what must it refuse or hand off?
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities and approvals
      description: List required/optional/denied capabilities and human approval gates.
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Platform-neutral behavior
      description: Describe the role's inputs, outputs, and lifecycle without naming or configuring an AI harness.
    validations:
      required: true
  - type: textarea
    id: evals
    attributes:
      label: Suggested evals
      description: Include normal work, refusal, escalation, and permission-boundary cases.
