name: Bug report
description: Report a validator, packer, catalog, or compatibility-package defect.
title: 'bug: '
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: RoleHub version or commit
    validations:
      required: true
  - type: input
    id: compatibility
    attributes:
      label: Compatibility package and harness version
      placeholder: rolehub-compat-codex 0.2.0 / Codex 0.145.0
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use a minimal role without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
